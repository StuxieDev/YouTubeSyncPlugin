<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #aa5cc3 0%, #00a4dc 100%);
    display: flex; align-items: center; justify-content: center; gap: 56px;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; color: #fff;
  }
  .mark { width: 300px; height: 300px; flex: none; }
  .text { display: flex; flex-direction: column; }
  h1 { margin: 0; font-size: 124px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  p { margin: 18px 0 0 6px; font-size: 40px; font-weight: 400; opacity: .9; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
    <rect x="4" y="4" width="120" height="120" rx="28" fill="#ffffff" fill-opacity=".16"/>
    <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
      <path d="M30 58 A34 34 0 0 1 90 40"/>
      <path d="M98 70 A34 34 0 0 1 38 88"/>
    </g>
    <path d="M84 26 L98 40 L80 46 Z" fill="#ffffff"/>
    <path d="M44 102 L30 88 L48 82 Z" fill="#ffffff"/>
    <path d="M54 46 L84 64 L54 82 Z" fill="#ffffff"/>
  </svg>
  <div class="text">
    <h1>YouTubeSync</h1>
    <p>Channels &amp; playlists for Jellyfin</p>
  </div>
</body>
</html>
